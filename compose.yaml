name: kameleo-workbench
services:
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - coordinator-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  volume-init:
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    user: root
    command: ["sh", "-c", "chown 1001:1001 /exports /state && chmod 700 /exports /state"]
    volumes:
      - exports:/exports
      - workbench-state:/state
  kameleo:
    image: kameleo/kameleo-app@sha256:56427134c725c5d36634640ff1579b167137ac08e05bdbb9705879a4e4298c4f
    platform: linux/amd64
    environment:
      PAT: ${KAMELEO_PAT:?Set KAMELEO_PAT in .env}
      VNCENABLE: "1"
      VNCPASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      VERBOSE: "0"
    shm_size: 2gb
    volumes:
      - kameleo-data:/data
      - exports:/exports
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
  workbench:
    build: .
    init: true
    environment:
      KAMELEO_URL: http://kameleo:5050
      KAMELEO_VNC_URL: ws://kameleo/websockify
      VNC_PASSWORD: ${VNC_PASSWORD}
      WORKBENCH_TOKEN: ${WORKBENCH_TOKEN:-}
      KAMELEO_EXPORT_DIR: /exports
      DEMO_URL: http://workbench:3180/demo
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MAX_CONCURRENCY: "1"
      RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-600000}
      DATABASE_URL: postgresql://workbench:${POSTGRES_PASSWORD}@database:5432/workbench
      KAMELEO_TEAM_KEY: ${KAMELEO_TEAM_KEY:?Set a stable provider team key}
      KAMELEO_BROWSER_BUDGET: ${KAMELEO_BROWSER_BUDGET:-1}
      WORKBENCH_TENANT_ID: ${WORKBENCH_TENANT_ID:-}
      ENABLE_TEST_FIXTURE: ${ENABLE_TEST_FIXTURE:-false}
      FIXTURE_ORIGIN: ${FIXTURE_ORIGIN:-http://workbench:3180}
      FLOW_POLICIES_FILE: ${FLOW_POLICIES_FILE:-}
      IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS:-180000}
    ports:
      - "127.0.0.1:3180:3180"
    volumes:
      - workbench-state:/state
      - exports:/exports
      - ./automations:/app/automations:ro
      - ./flows:/app/flows:ro
    depends_on:
      kameleo:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  kameleo-data:
  workbench-state:
  exports:
  coordinator-data:
